# .github/workflows/deploy.yml
# Workflow de despliegue a GitHub Pages.
# Diseñado para ser invocado SOLO después de que pasen las auditorías
# (workflow_call desde audit-posts.yml).
# También se puede disparar manualmente (workflow_dispatch).

name: Deploy to GitHub Pages

on:
  workflow_call:  # Permite ser llamado desde audit-posts.yml después de checks
  workflow_dispatch:  # Permite ejecución manual desde Actions tab

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install, build, and upload your site output
        uses: withastro/action@fc88a7002f0c62327f26fb1b15f2a1d581249278 # v5.1.0
        # with:
        #   path: .
        #   node-version: 22
        #   package-manager: pnpm@latest
        #   build-cmd: pnpm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5