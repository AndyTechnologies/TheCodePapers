# .github/workflows/audit-posts.yml
# Workflow de auditoría ortográfica y gramatical para posts del blog.
# Se ejecuta en push a main y en pull_request hacia main.
# Dos jobs: ortografía (cspell) y gramática (LanguageTool).
# Si AMBOS pasan y es push a main, invoca el workflow de deploy (workflow_call).

name: Audit Posts (Ortografía + Gramática)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos necesarios
permissions:
  contents: read
  pull-requests: write  # Para que reviewdog pueda crear anotaciones en PR
  checks: write         # Para reportar resultados como checks

jobs:
  # ------------------------------------------------------------
  # PASO A – Ortografía con cspell (reemplaza spellcheck-github-actions)
  # ------------------------------------------------------------
  ortografia:
    name: Ortografía (cspell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run cspell on blog posts
        run: npx cspell --config .cspell.json "src/content/blog/**/*.md"
        # cspell sale con código 1 si hay errores, lo que falla el job automáticamente

  # ------------------------------------------------------------
  # PASO B – Gramática y estilo con reviewdog/action-languagetool
  # ------------------------------------------------------------
  gramatica:
    name: Gramática y estilo (LanguageTool)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run LanguageTool on Markdown posts
        uses: reviewdog/action-languagetool@v1
        with:
          # Idioma: español
          language: es
          # Patrones de archivos a analizar (posts del blog en Astro)
          patterns: "src/content/blog/**/*.md"
          # Reporter: github-pr-check muestra anotaciones en la pestaña Checks del PR
          reporter: github-pr-check
          # Nivel de severidad a reportar: error, warning, info
          level: error
          # Configuración adicional de LanguageTool
          # Desactivamos reglas que generan falsos positivos en contenido técnico
          args: >
            --disable WHITESPACE_RULE
            --disable UPPERCASE_SENTENCE_START
            --disable EN_QUOTES
            --disable EN_UNPAIRED_BRACKETS
            --disable EN_A_VS_AN

  # ------------------------------------------------------------
  # Invocar workflow de Deploy (solo si ambos chequeos pasan Y es push a main)
  # ------------------------------------------------------------
  trigger-deploy:
    name: Trigger Deploy Workflow
    needs: [ortografia, gramatica]  # Gate obligatorio: ambos deben pasar
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # Necesario para createWorkflowDispatch
    steps:
      - name: Trigger deploy workflow
        uses: actions/github-script@v7
        with:
          script: |
            // Listar workflows para encontrar "Deploy to GitHub Pages"
            const { data: { workflows } } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const deployWorkflow = workflows.find(w => w.name === 'Deploy to GitHub Pages');
            if (!deployWorkflow) {
              throw new Error('Workflow "Deploy to GitHub Pages" no encontrado');
            }
            // Disparar el workflow
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: deployWorkflow.id,
              ref: 'main'
            });
            console.log(`Deploy workflow disparado: ${deployWorkflow.name} (id: ${deployWorkflow.id})`);
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}