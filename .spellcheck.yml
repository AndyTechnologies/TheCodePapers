# .spellcheck.yml
# Configuración para rojopolis/spellcheck-github-actions (v0).
# Define las fuentes a revisar (archivos Markdown de contenido) y el diccionario personalizado.
# Se usa en el workflow CI como Paso A (Ortografía).

# Carpeta(s) que contienen los posts en Markdown a auditar
# Ajusta si tu estructura cambia (ej: src/pages/posts/)
sources:
  - src/content/blog/**/*.md

