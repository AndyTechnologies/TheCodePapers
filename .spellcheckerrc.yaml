# Ignorar frontmatter de Astro (todo lo que está entre ---)
# spellchecker-cli usa regex para ignorar bloques
ignore:
  # Patrón para ignorar frontmatter YAML completo
  - pattern: '^---[\s\S]*?^---'
    flags: 'gm'
  # Ignorar bloques de código (fenced code blocks)
  - pattern: '^```[\s\S]*?^```'
    flags: 'gm'
  # Ignorar código inline
  - pattern: '`[^`]+`'
  # Ignorar URLs
  - pattern: 'https?://[^\s]+'
  # Ignorar rutas de archivos
  - pattern: '(?:src|public|dist|node_modules)/[^\s]+'
  # Ignorar etiquetas HTML
  - pattern: '<[^>]+>'
  # Ignorar referencias estilo markdown [texto](url)
  - pattern: '\[([^\]]+)\]\([^)]+\)'
    # Solo ignorar la URL, no el texto
  # Ignorar imágenes markdown ![alt](url)
  - pattern: '!\[([^\]]*)\]\([^)]+\)'

# Configuración adicional
# report: solo muestra errores, no warnings
reporter: default
# No sugerir correcciones automáticas (solo reportar)
suggest: false
# Color en salida
color: true