<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TCP">
  <!-- Fondo blanco para que el favicon se vea bien en pestañas claras y oscuras -->
  <rect width="64" height="64" fill="#FFFFFF"/>

  <!-- Letras TCP -->
  <g fill="#000000"
     font-family="'Comic Sans MS', 'Comic Sans', 'Comic Neue', cursive"
     font-weight="700"
     font-size="24"
     letter-spacing="1.5"
     text-anchor="middle">
    <text x="32" y="40">TCP</text>
  </g>

  <!-- Línea minimalista inferior -->
  <rect x="18" y="50" width="28" height="1.6" fill="#000000"/>
</svg>